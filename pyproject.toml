[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "bn-bot"
version = "0.5.20"
description = "Discord bot for server management, moderation and community features"
requires-python = ">=3.12"
dependencies = [
  "discord.py[voice]==2.7.1",
  "SQLAlchemy[asyncio]==2.1.3",
  "greenlet>=3.1,<4",
  "asyncpg>=0.29,<1",
  "psycopg[binary]>=3.2,<4",
  "alembic==1.20.0",
  "redis==8.0.0",
  "fastapi==0.142.2",
  "uvicorn[standard]>=0.35,<1",
  "jinja2>=3.1,<4",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "itsdangerous>=2.2,<3",
  "pydantic-settings==2.15.0",
  "python-multipart>=0.0.20,<1",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "aiosqlite>=0.21,<1",
  "ruff>=0.13,<1",
  "mypy>=1.18,<2",
]

[tool.setuptools.packages.find]
include = ["api*", "app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
